trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'
  npm_config_cache: $(Pipeline.Workspace)/.npm

jobs:
  - job: Backend
    displayName: Backend (Spring Boot)
    pool:
      vmImage: ubuntu-latest
    steps:
      - task: JavaToolInstaller@0
        displayName: Install JDK 17
        inputs:
          versionSpec: '17'
          jdkArchitectureOption: x64
          jdkSourceOption: PreInstalled

      - task: Cache@2
        displayName: Cache Maven local repository
        inputs:
          key: 'maven | "$(Agent.OS)" | backend/backend/pom.xml'
          restoreKeys: |
            maven | "$(Agent.OS)"
            maven
          path: $(MAVEN_CACHE_FOLDER)

      - script: chmod +x mvnw
        workingDirectory: backend/backend
        displayName: Make mvnw executable

      - script: ./mvnw -B clean package -DskipTests
        workingDirectory: backend/backend
        displayName: Build (same flags as Render Dockerfile)

      - task: PublishPipelineArtifact@1
        displayName: Publish backend JAR
        inputs:
          targetPath: backend/backend/target/backend-0.0.1-SNAPSHOT.jar
          artifact: backend-jar

  - job: Frontend
    displayName: Frontend (Expo)
    pool:
      vmImage: ubuntu-latest
    steps:
      - task: UseNode@1
        displayName: Install Node.js 20
        inputs:
          version: '20.x'

      - task: Cache@2
        displayName: Cache npm
        inputs:
          key: 'npm | "$(Agent.OS)" | frontend/inventario-app/package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
            npm
          path: $(npm_config_cache)

      - script: npm ci
        workingDirectory: frontend/inventario-app
        displayName: Install dependencies

      - script: npm run lint
        workingDirectory: frontend/inventario-app
        displayName: Lint
