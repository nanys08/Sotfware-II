# ===============================
# CONFIGURACIÓN DE BASE DE DATOS
# ===============================
spring.datasource.url=jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.username=postgres.xevssdqxnfeyriximhkp
spring.datasource.password=P2N6D8A7anny
spring.datasource.driver-class-name=org.postgresql.Driver

# Limitar conexiones
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0

# ===============================
# CONFIGURACIÓN JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# ===============================
# SERVIDOR
# ===============================
server.port=${PORT:8080}
server.address=0.0.0.0

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=false

# ===============================
# LOGGING
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# OBSERVABILIDAD (DevOps - Monitoreo)
# Actuator + Micrometer exponen metricas en formato Prometheus.
# Prometheus las recolecta y Grafana las grafica (ver docker-compose.yml).
# ===============================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=inventario-backend
management.metrics.distribution.percentiles-histogram.http.server.requests=true
info.app.name=Sistema de Inventario
info.app.modulo=Backend Spring Boot
info.app.equipo=DevOps