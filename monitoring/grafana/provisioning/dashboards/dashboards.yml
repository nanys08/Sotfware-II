# ============================================================
# Grafana - Provider de dashboards.
# Carga automaticamente los JSON ubicados en /var/lib/grafana/dashboards.
# ============================================================
apiVersion: 1

providers:
  - name: 'Dashboards Inventario'
    orgId: 1
    folder: 'Sistema de Inventario'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
